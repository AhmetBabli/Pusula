[pytest]
minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
testpaths = 
    backend/tests
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*
asyncio_mode = auto
markers =
    integration: integration tests
    slow: slow tests
    unit: unit tests
